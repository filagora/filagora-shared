name: lint

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        default: '8.4'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Fetch shared scripts
        uses: actions/checkout@v4
        with:
          repository: filagora/filagora-shared
          ref: master
          path: .filagora-shared

      - name: README layout
        env:
          README_EXTRA_SECTIONS: ${{ github.repository == 'filagora/filagora-package-skeleton' && 'Creating a package from this template' || '' }}
        run: bash .filagora-shared/scripts/check-readme-layout.sh

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pint (check only)
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Composer audit
        run: composer audit
