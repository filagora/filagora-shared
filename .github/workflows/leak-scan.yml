name: leak-scan

on:
  workflow_call:
    inputs:
      allowed-emails:
        description: Newline-separated email addresses that may appear in the repo
        type: string
        default: security@zen-cart.com
    secrets:
      LEAK_PATTERNS:
        description: Newline-separated extended regexes that must not appear in tracked files
        required: false

permissions:
  contents: read

jobs:
  patterns:
    name: Pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch scan script
        uses: actions/checkout@v4
        with:
          repository: filagora/filagora-shared
          ref: master
          path: .filagora-shared

      - name: Scan tracked files
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          ALLOWED_EMAILS: ${{ inputs.allowed-emails }}
        run: bash .filagora-shared/scripts/leak-scan.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks action needs a paid licence for organisation accounts; the command-line
      # tool it wraps is MIT licensed, so run that directly, pinned and checksum-verified.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/${archive}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum --check -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan history for secrets
        run: gitleaks git --no-banner --redact --verbose .
