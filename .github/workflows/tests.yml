name: tests

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        default: '8.4'
      laravel:
        description: Laravel constraint installed into the Testbench run
        type: string
        default: '^13.0'
      testbench:
        description: orchestra/testbench constraint matching the Laravel version
        type: string
        default: '^11.0'
      prefer:
        description: Composer install flavour, prefer-stable or prefer-lowest
        type: string
        default: prefer-stable
      mariadb-version:
        type: string
        default: '11.4'
      meilisearch-version:
        description: Start a Meilisearch of this version on port 7700 for the tests (empty starts none)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  mariadb:
    name: MariaDB ${{ inputs.mariadb-version }} (${{ inputs.prefer }})
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:${{ inputs.mariadb-version }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl, pdo_mysql
          coverage: none

      - name: Start Meilisearch
        if: inputs.meilisearch-version != ''
        run: |
          docker run -d --name meilisearch -p 7700:7700 -e MEILI_MASTER_KEY=testing-master-key -e MEILI_ENV=development getmeili/meilisearch:v${{ inputs.meilisearch-version }}
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7700/health && break; sleep 2; done
          curl -sf http://127.0.0.1:7700/health

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ inputs.laravel }}" "orchestra/testbench:${{ inputs.testbench }}" --no-interaction --no-update
          composer update --${{ inputs.prefer }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --ci
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
          MEILISEARCH_HOST: http://127.0.0.1:7700
          MEILISEARCH_KEY: testing-master-key
