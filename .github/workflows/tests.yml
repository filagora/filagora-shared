name: tests

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        default: '8.4'
      laravel:
        description: Laravel constraint installed into the Testbench run
        type: string
        default: '^13.0'
      testbench:
        description: orchestra/testbench constraint matching the Laravel version
        type: string
        default: '^11.0'
      prefer:
        description: Composer install flavour, prefer-stable or prefer-lowest
        type: string
        default: prefer-stable
      mariadb:
        description: Also run the suite against MariaDB
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sqlite:
    name: SQLite (${{ inputs.prefer }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ inputs.laravel }}" "orchestra/testbench:${{ inputs.testbench }}" --no-interaction --no-update
          composer update --${{ inputs.prefer }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --ci
        env:
          DB_CONNECTION: testing

  mariadb:
    name: MariaDB
    if: ${{ inputs.mariadb }}
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ inputs.laravel }}" "orchestra/testbench:${{ inputs.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --ci
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
